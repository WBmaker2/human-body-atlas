<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Human Body Atlas는 레이어로 인체를 탐험하는 생물 수업 도구입니다." />
    <meta name="theme-color" content="#120a0c" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Human Body Atlas — 인체 3D 아틀라스</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #120a0c; color: #f3e9ec; }
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 10px; background: radial-gradient(circle at 50% 42%, #2a1418 0%, #120a0c 62%, #080405 100%); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .boot-title { margin: 0; font-size: 24px; font-weight: 800; }
      .boot-sub { margin: 0; color: #c4a3ac; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <p class="boot-title">Human Body Atlas</p>
      <p class="boot-sub">인체 3D 아틀라스를 준비하고 있습니다</p>
    </div>
    <noscript><div style="position: fixed; inset: 0; display: grid; place-content: center; padding: 24px">사용하려면 JavaScript를 허용해야 합니다.</div></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
